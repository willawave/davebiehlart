# CI for davebiehlart.com — runs on every pull request, every merge queue group, and every push
# to main.
#
# This workflow never authenticates to Google Cloud and references no secrets. Nothing here can
# reach the production Firebase project: the rules suite runs against the emulators under the
# demo-bronze-horse-rules project, and the web build prerenders only static pages (everything
# else is SSR at request time), so no job reads live Firestore.

name: CI

on:
  pull_request:
  # The merge queue tests each PR on top of main plus the PRs queued ahead of it before merging.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR runs are cancelled. Merge queue and push runs are never cancelled, so every
# queued group and every merge to main keeps its own checks.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Parts of the repo predate Prettier and are formatted as they are touched, so this checks
      # only the files a change adds or modifies.
      #   pull_request  everything since the merge base with the PR's base branch
      #   merge_group   everything in the queued group, i.e. since the group's base commit
      #   push main     the pushed commits; if `before` is missing or unreachable (first push,
      #                 force-push), fall back to the tip commit
      - name: Prettier check on changed files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ "$EVENT" = "merge_group" ]; then
            base="$GROUP_BASE"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git rev-parse --verify -q HEAD~1 || git hash-object -t tree /dev/null)
          fi
          echo "Checking files changed since $base"
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD \
            | xargs -0 --no-run-if-empty pnpm exec prettier --check --ignore-unknown

  # Every change to main must claim a new, higher VERSION with a matching CHANGELOG entry, so
  # parallel branches can't land the same version. HEAD^1 is the commit this change lands on:
  #   pull_request  the base branch tip (first parent of the PR merge commit)
  #   merge_group   main plus the PRs queued ahead, so two queued PRs claiming the same
  #                 VERSION fail here instead of both merging
  #   push main     the previous main commit
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: VERSION is bumped and has a CHANGELOG entry
        run: |
          new=$(tr -d '[:space:]' < VERSION)
          old=$(git show HEAD^1:VERSION | tr -d '[:space:]')
          echo "VERSION: $old -> $new"
          highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)
          if [ "$new" = "$old" ] || [ "$highest" != "$new" ]; then
            echo "::error file=VERSION::VERSION must be higher than $old (got $new). Bump it, or re-run /ship if another PR already took $new."
            exit 1
          fi
          if ! grep -qF "## [$new]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## [$new]' entry."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ng test core --watch=false
      - run: pnpm ng test web --watch=false
      - run: pnpm ng test admin --watch=false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ng build core
      - run: pnpm ng build web
      - run: pnpm ng build admin

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Firestore and Storage emulators are Java programs.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # `pnpm e2e` runs under the Auth and Firestore emulators, which need Java.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
