<a class="skip-link" [href]="skipHref()" (click)="skipToMain($event)">Skip to content</a>

<mat-sidenav-container class="container">
  <mat-sidenav
    class="drawer"
    position="end"
    mode="over"
    fixedInViewport
    [opened]="menuOpen()"
    (openedChange)="menuOpen.set($event)"
  >
    <div class="drawer-head">
      <button type="button" matIconButton aria-label="Close menu" (click)="menuOpen.set(false)">
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">close</mat-icon>
      </button>
    </div>
    <nav aria-label="Menu">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
          >{{ link.label }}</a
        >
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="page">
    <header class="masthead">
      <a class="brand" routerLink="/">Dave Biehl Art</a>
      <div class="actions">
        <app-color-scheme />
        <button
          type="button"
          class="menu-button"
          matIconButton
          aria-label="Open menu"
          [attr.aria-expanded]="menuOpen()"
          (click)="menuOpen.set(true)"
        >
          <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">menu</mat-icon>
        </button>
      </div>
      <nav class="links" aria-label="Main">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            ariaCurrentWhenActive="page"
            >{{ link.label }}</a
          >
        }
      </nav>
    </header>

    <div class="content">
      <app-breadcrumb />
      <main #main id="main" tabindex="-1">
        <router-outlet />
      </main>
    </div>

    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
