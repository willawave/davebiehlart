<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dave Biehl Art</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bronze sculpture, statues, and kiln glass by artist Dave Biehl."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dave Biehl Art" />
    <meta property="og:title" content="Dave Biehl Art" />
    <meta
      property="og:description"
      content="Bronze sculpture, statues, and kiln glass by artist Dave Biehl."
    />
    <meta property="og:url" content="https://davebiehlart.com/" />
    <meta property="og:image" content="https://davebiehlart.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dave Biehl Art: a bronze mare-and-foal mark beside the name"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply a saved light/dark choice before first paint (ColorSchemeService writes it).
      try {
        var scheme = localStorage.getItem('color-scheme');
        if (scheme === 'light' || scheme === 'dark') {
          document.documentElement.style.colorScheme = scheme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
