<section class="panel wide" aria-labelledby="add-heading">
  <p class="back"><a routerLink="/events">‹ Events</a></p>
  <h1 id="add-heading" #heading tabindex="-1">Add event</h1>
  @if (store.error(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }
  <app-event-form [saving]="store.loading()" (saved)="onSave($event)" (cancelled)="cancel()" />
</section>
