<header>
  <mat-toolbar class="app-bar">
    <span class="brand dba-lockup"
      ><span class="dba-mark" aria-hidden="true"></span
      ><span class="dba-wordmark">Dave Biehl Art</span></span
    >
    @if (store.authorizedUser(); as user) {
      <span class="spacer"></span>
      <span class="user">{{ user.email }}</span>
      <button matButton="outlined" type="button" class="sign-out" (click)="signOut()">
        Sign out
      </button>
    }
  </mat-toolbar>
</header>
<main>
  <router-outlet />
</main>
