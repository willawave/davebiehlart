<header>
  <mat-toolbar class="app-bar">
    <span class="brand">The Bronze Horse</span>
    @if (store.authorizedUser(); as user) {
      <span class="spacer"></span>
      <span class="user">{{ user.email }}</span>
      <button matButton="outlined" type="button" class="sign-out" (click)="signOut()">
        Sign out
      </button>
    }
  </mat-toolbar>
</header>
<main>
  <router-outlet />
</main>
