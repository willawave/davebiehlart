<section class="panel" aria-labelledby="dashboard-heading">
  <h1 id="dashboard-heading" #heading tabindex="-1">Dashboard</h1>
  @if (store.error(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }
  <p class="muted">
    Signed in as <strong>{{ store.authorizedUser()?.email }}</strong>
  </p>
  <nav aria-label="Manage">
    <ul class="sections">
      <li><a matButton="outlined" routerLink="/gallery">Gallery</a></li>
      <li><a matButton="outlined" routerLink="/statues">Statues</a></li>
      <li><a matButton="outlined" routerLink="/events">Events</a></li>
    </ul>
  </nav>
</section>
