<section class="panel wide" aria-labelledby="edit-heading">
  <p class="back"><a routerLink="/media">‹ Media</a></p>
  <h1 id="edit-heading" #heading tabindex="-1">Edit media</h1>
  @if (store.error(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }
  @if (loaded()) {
    <app-media-form
      [initial]="store.selectedFormValue() ?? undefined"
      [otherLinks]="otherLinks()"
      [saving]="store.loading()"
      (saved)="onSave($event)"
      (cancelled)="cancel()"
    />
  } @else if (store.loading()) {
    <p class="muted" role="status">Loading…</p>
  } @else if (!store.error()) {
    <p class="muted">This media item doesn't exist. It may have been deleted.</p>
  }
</section>
